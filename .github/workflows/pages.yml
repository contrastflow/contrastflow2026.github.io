name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: Media to publish
        type: choice
        options:
          - default
          - compact
          - full
        default: default

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Select media variant
        id: media
        env:
          REQUESTED_VARIANT: ${{ inputs.variant }}
        run: |
          variant="${REQUESTED_VARIANT:-default}"
          if [ "$variant" = default ]; then
            variant="$(cat .github/pages-variant)"
          fi
          case "$variant" in
            compact|full) echo "variant=$variant" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown Pages media variant: $variant" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v6
        if: steps.media.outputs.variant == 'compact'
        with:
          ref: pages-compact-media
          path: .pages-compact
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Prepare static website
        env:
          PAGES_VARIANT: ${{ steps.media.outputs.variant }}
        run: |
          if [ "$PAGES_VARIANT" = compact ]; then
            python3 scripts/build_pages.py --compact-media .pages-compact
          else
            python3 scripts/build_pages.py
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for uploaded website
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..24}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq "[.artifacts[] | select(.name == \"$SITE_ARTIFACT\" and .expired == false)] | length")
            if [ "$count" = "1" ]; then exit 0; fi
            sleep 5
          done
          echo "Uploaded website is not yet available for deployment."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
